name: Check setup / refresh token

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [check, refresh-token]
        default: check
  schedule:
    - cron: "17 9 * * 1"   # every Monday: refresh the 60-day Instagram token

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.action }}" = "refresh-token" ]; then
            python -m autopost.refresh_token
          else
            python -m autopost.check_setup
          fi
