name: Publish Instagram post

on:
  schedule:
    # 13:00 / 17:00 / 21:00 New York time, for both daylight (EDT) and
    # standard (EST) time; each slot fires at +2 min and a backup at +25 min.
    # The script ignores the lines that do not match the current season and
    # never posts the same slot twice.
    - cron: "2 17 * * *"
    - cron: "25 17 * * *"
    - cron: "2 18 * * *"
    - cron: "25 18 * * *"
    - cron: "2 21 * * *"
    - cron: "25 21 * * *"
    - cron: "2 22 * * *"
    - cron: "25 22 * * *"
    - cron: "2 1 * * *"
    - cron: "25 1 * * *"
    - cron: "2 2 * * *"
    - cron: "25 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Post date, New York (YYYY-MM-DD)"
        required: true
      slot:
        description: "Slot: 1 = 13:00, 2 = 17:00, 3 = 21:00 NY"
        required: true
        default: "1"
      dry_run:
        description: "Dry run (prepare and preview, do not publish)"
        type: boolean
        default: true
      force:
        description: "Publish even if already marked as published"
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m autopost.publish --cron "${{ github.event.schedule }}"
          else
            ARGS="--date ${{ inputs.date }} --slot ${{ inputs.slot }}"
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
            python -m autopost.publish $ARGS
          fi

      - name: Save publish log
        if: always()
        run: |
          git config user.name autopost
          git config user.email autopost@users.noreply.github.com
          git add state/published.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "published ${{ github.event.schedule || inputs.date }}"; git pull --rebase -q; git push; }

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
          if-no-files-found: ignore
          retention-days: 7
