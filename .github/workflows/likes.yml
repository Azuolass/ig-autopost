name: Watch likes

on:
  schedule:
    - cron: "41 * * * *"   # every hour
  workflow_dispatch:

concurrency:
  group: likes-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  likes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Check like counts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m autopost.likes
      - name: Save state
        run: |
          git config user.name autopost
          git config user.email autopost@users.noreply.github.com
          git add state/likes.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "likes check"; git pull --rebase -q; git push; }
